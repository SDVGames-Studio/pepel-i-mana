name: Tests

on: [push, pull_request, workflow_dispatch]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        run: |
          mkdir -p godot
          curl -sSfL https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -oq /tmp/godot.zip -d godot
          mv "godot/Godot_v4.7.2-stable_linux.x86_64" godot/godot
          chmod +x godot/godot
          godot/godot --version

      - name: Import assets
        run: |
          godot/godot --headless --path . --import > import.log 2>&1 || echo "import: есть предупреждения"
        # импорт печатает много шума — ошибки всплывут в тестах

      - name: Run tests
        run: |
          set -o pipefail
          godot/godot --headless --path . --script res://tests/run_all.gd 2>&1 | tee tests.log

      - name: Verdict
        if: always()
        run: |
          echo "## Результат автотестов" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -30 tests.log >> "$GITHUB_STEP_SUMMARY" || echo "лога нет — тесты не стартовали" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -q "OK: все тесты пройдены" tests.log
