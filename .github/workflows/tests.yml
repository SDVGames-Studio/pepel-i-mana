name: Tests

on: [push, pull_request, workflow_dispatch]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        run: |
          mkdir -p godot
          curl -sSfL https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -oq /tmp/godot.zip -d godot
          mv "godot/Godot_v4.7.2-stable_linux.x86_64" godot/godot
          chmod +x godot/godot
          godot/godot --version

      - name: Import assets
        run: godot/godot --headless --path . --import || echo "import warnings ignored"

      - name: Run tests
        run: godot/godot --headless --path . --script res://tests/run_all.gd
