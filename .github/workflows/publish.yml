name: publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  publish:
    name: Export Windows build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Godot and export templates
        run: |
          set -e
          curl -L --retry 3 -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -o /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot

          curl -L --retry 3 -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION%-stable}.stable
          unzip -o /tmp/templates.tpz -d /tmp/tpz
          mv /tmp/tpz/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION%-stable}.stable/

      - name: Import project assets
        run: godot --headless --editor --import --path .

      - name: Export Windows
        run: |
          mkdir -p build
          # ASCII-имя: кириллица в путях экспорта недетерминированно
          # переживает zip-артефакт/загрузку релиза; в релизе переименуем
          # ASCII-имя: GitHub санитизирует не-ASCII имена ассетов релиза
          # (кириллица превращается в default.exe, PATCH не помогает)
          godot --headless --export-release "Windows Desktop" build/PepelIMana.exe
          test -s build/PepelIMana.exe

      - name: Export Linux
        run: |
          mkdir -p build/linux
          godot --headless --export-release "Linux" build/linux/PepelIMana.x86_64
          test -s build/linux/PepelIMana.x86_64

      - name: Export Web
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html
          test -s build/web/index.html
          test -s build/web/index.wasm
          cd build/web && zip -q -r ../PepelIMana-web.zip . && cd ../..
          test -s build/PepelIMana-web.zip

      - name: Read game version
        id: version
        run: |
          V=$(python3 -c "import json;print(json.load(open('data/version.json'))['version'])")
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Upload web build artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

      - name: Create latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest \
            --repo "$GITHUB_REPOSITORY" \
            --cleanup-tag \
            --yes 2>/dev/null || true

          gh release create latest \
            build/PepelIMana.exe \
            build/linux/PepelIMana.x86_64 \
            build/PepelIMana-web.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "Пепел и Мана — v${{ steps.version.outputs.version }}" \
            --target "$GITHUB_SHA" \
            --notes "Автосборка из main (v${{ steps.version.outputs.version }}, коммит $GITHUB_SHA).

          - **Windows**: PepelIMana.exe — скачать и запустить, установка не нужна.
          - **Linux**: PepelIMana.x86_64 — chmod +x PepelIMana.x86_64 && ./PepelIMana.x86_64.
          - **Браузер**: PepelIMana-web.zip — распаковать и открыть index.html, или играть онлайн на GitHub Pages.

          (при желании файлы можно переименовать, на игру имя не влияет)."

          echo "asset: PepelIMana.exe (GitHub не принимает кириллицу в именах ассетов)" >> "$GITHUB_STEP_SUMMARY"

  pages:
    name: Deploy web game to GitHub Pages
    needs: publish
    # ВНИМАНИЕ: создать Pages-сайт может только ВЛАДЕЛЕЦ репо из UI
    # (Settings → Pages → Source: GitHub Actions) — GITHUB_TOKEN не имеет
    # права administration (ключ отвергается, workflow = Invalid), а PAT
    # агента не админ. После одноразового включения деплоится автоматически.
    # До того — job падает мягко, релиз (exe/linux/web.zip) выходит как всегда.
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
