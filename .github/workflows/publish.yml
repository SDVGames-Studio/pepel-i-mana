name: publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  publish:
    name: Export Windows build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Godot and export templates
        run: |
          set -e
          curl -L --retry 3 -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -o /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot

          curl -L --retry 3 -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION%-stable}.stable
          unzip -o /tmp/templates.tpz -d /tmp/tpz
          mv /tmp/tpz/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION%-stable}.stable/

      - name: Import project assets
        run: godot --headless --editor --import --path .

      - name: Export Windows
        run: |
          mkdir -p build
          # ASCII-имя: кириллица в путях экспорта недетерминированно
          # переживает zip-артефакт/загрузку релиза; в релизе переименуем
          # ASCII-имя: GitHub санитизирует не-ASCII имена ассетов релиза
          # (кириллица превращается в default.exe, PATCH не помогает)
          godot --headless --export-release "Windows Desktop" build/PepelIMana.exe
          test -s build/PepelIMana.exe

      - name: Read game version
        id: version
        run: |
          V=$(python3 -c "import json;print(json.load(open('data/version.json'))['version'])")
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Create latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest \
            --repo "$GITHUB_REPOSITORY" \
            --cleanup-tag \
            --yes 2>/dev/null || true

          gh release create latest \
            build/PepelIMana.exe \
            --repo "$GITHUB_REPOSITORY" \
            --title "Пепел и Мана — v${{ steps.version.outputs.version }}" \
            --target "$GITHUB_SHA" \
            --notes "Автосборка из main (v${{ steps.version.outputs.version }}, коммит $GITHUB_SHA). Запуск: скачать PepelIMana.exe и запустить — установка не нужна (при желании файл можно переименовать, на игру имя не влияет)."

          echo "asset: PepelIMana.exe (GitHub не принимает кириллицу в именах ассетов)" >> "$GITHUB_STEP_SUMMARY"
