name: publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  publish:
    name: Export Windows build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Godot and export templates
        run: |
          set -e
          curl -L --retry 3 -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -o /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot

          curl -L --retry 3 -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION%-stable}.stable
          unzip -o /tmp/templates.tpz -d /tmp/tpz
          mv /tmp/tpz/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION%-stable}.stable/

      - name: Import project assets
        run: godot --headless --editor --import --path .

      - name: Export Windows
        run: |
          mkdir -p build
          # ASCII-имя: кириллица в путях экспорта недетерминированно
          # переживает zip-артефакт/загрузку релиза; в релизе переименуем
          godot --headless --export-release "Windows Desktop" "build/ПепелИМана.exe"
          test -s "build/ПепелИМана.exe"

      - name: Read game version
        id: version
        run: |
          V=$(python3 -c "import json;print(json.load(open('data/version.json'))['version'])")
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Create latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest \
            --repo "$GITHUB_REPOSITORY" \
            --cleanup-tag \
            --yes 2>/dev/null || true

          gh release create latest \
            "build/ПепелИМана.exe" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Пепел и Мана — v${{ steps.version.outputs.version }}" \
            --target "$GITHUB_SHA" \
            --notes "Автосборка из main (v${{ steps.version.outputs.version }}, коммит $GITHUB_SHA). Запуск: скачать exe и запустить — установка не нужна."

          # вернуть ассету русское имя (ASCII-путь надёжен в upload,
          # имя ассета меняем через API); ответ и итог — в step summary
          ASSET_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/latest" --jq '.assets[0].id')
          echo "PATCH asset id=$ASSET_ID" >> "$GITHUB_STEP_SUMMARY"
          curl -sS -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" \
            -d '{"name":"\u041f\u0435\u043f\u0435\u043b\u0418\u041c\u0430\u043d\u0430.exe"}' \
            | head -c 400 >> "$GITHUB_STEP_SUMMARY"
          NAME=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/latest" --jq '.assets[0].name')
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "final asset name: $NAME" >> "$GITHUB_STEP_SUMMARY"
